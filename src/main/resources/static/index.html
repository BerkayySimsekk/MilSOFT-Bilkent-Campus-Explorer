<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An interactive map of important Bilkent University campus locations.">
  <title>Bilkent Campus Explorer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <main class="app-content">
      <aside id="location-filter-sidebar" class="sidebar filter-sidebar" aria-label="Campus location search and filters">
        <form id="filter-form" class="filters">
          <label for="search-input">Search locations</label>
          <input id="search-input" name="search" type="search" placeholder="Name, category, or description" autocomplete="off">

          <fieldset class="category-visibility">
            <legend>Visible categories</legend>
            <div class="category-toggle-list">
              <div class="category-toggle-row"><label class="category-toggle"><input type="checkbox" name="category-visibility" value="Building" checked>Building</label><button class="category-export" type="button" data-export-category="Building" aria-label="Export Building as GeoJSON">Export GeoJSON</button></div>
              <div class="category-toggle-row"><label class="category-toggle"><input type="checkbox" name="category-visibility" value="Food" checked>Food</label><button class="category-export" type="button" data-export-category="Food" aria-label="Export Food as GeoJSON">Export GeoJSON</button></div>
              <div class="category-toggle-row"><label class="category-toggle"><input type="checkbox" name="category-visibility" value="Health" checked>Health</label><button class="category-export" type="button" data-export-category="Health" aria-label="Export Health as GeoJSON">Export GeoJSON</button></div>
              <div class="category-toggle-row"><label class="category-toggle"><input type="checkbox" name="category-visibility" value="Parking" checked>Parking</label><button class="category-export" type="button" data-export-category="Parking" aria-label="Export Parking as GeoJSON">Export GeoJSON</button></div>
              <div class="category-toggle-row"><label class="category-toggle"><input type="checkbox" name="category-visibility" value="Transport" checked>Transport</label><button class="category-export" type="button" data-export-category="Transport" aria-label="Export Transport as GeoJSON">Export GeoJSON</button></div>
              <div class="category-toggle-row"><label class="category-toggle"><input type="checkbox" name="category-visibility" value="Services" checked>Services</label><button class="category-export" type="button" data-export-category="Services" aria-label="Export Services as GeoJSON">Export GeoJSON</button></div>
              <div class="category-toggle-row"><label class="category-toggle"><input type="checkbox" name="category-visibility" value="Recreation" checked>Recreation</label><button class="category-export" type="button" data-export-category="Recreation" aria-label="Export Recreation as GeoJSON">Export GeoJSON</button></div>
              <div class="category-toggle-row"><label class="category-toggle"><input type="checkbox" name="category-visibility" value="Culture" checked>Culture</label><button class="category-export" type="button" data-export-category="Culture" aria-label="Export Culture as GeoJSON">Export GeoJSON</button></div>
              <div class="category-toggle-row"><label class="category-toggle"><input type="checkbox" name="category-visibility" value="Custom" checked>Custom</label><button class="category-export" type="button" data-export-category="Custom" aria-label="Export Custom as GeoJSON">Export GeoJSON</button></div>
            </div>
          </fieldset>

          <button id="clear-all-custom-features-button" class="clear-all-custom-features-button" type="button">Clear all custom locations</button>
          <button id="area-filter-button" class="area-filter-button" type="button" aria-pressed="false">Select area to filter</button>
          <label for="feature-type-select">Location type to be added</label>
          <select id="feature-type-select" name="feature-type">
            <option value="Freehand">Freehand</option>
            <option value="Polygon">Polygon</option>
            <option value="Circle">Circle</option>
            <option value="LineString">Line</option>
            <option value="Point" selected>Point</option>
          </select>
        </form>
      </aside>

      <section class="map-area" aria-label="Interactive campus map">
        <div id="map" aria-label="OpenStreetMap campus location map" role="application"></div>
        <button id="map-mode-button" class="map-mode-button" type="button" aria-pressed="false">Show Elevation Map</button>
        <section id="elevation-legend" class="elevation-legend" aria-label="Elevation colour legend" hidden>
          <div class="elevation-legend-heading">
            <h2>Elevation</h2>
            <span>metres</span>
          </div>
          <div id="elevation-legend-scale" class="elevation-legend-scale">
            <div class="elevation-colour-bar" aria-hidden="true"></div>
            <ol class="elevation-legend-values">
              <li><i class="elevation-swatch elevation-low" aria-hidden="true"></i><span data-elevation-ratio="0">Low</span></li>
              <li><i class="elevation-swatch elevation-medium-low" aria-hidden="true"></i><span data-elevation-ratio="0.35">Medium-low</span></li>
              <li><i class="elevation-swatch elevation-medium" aria-hidden="true"></i><span data-elevation-ratio="0.6">Medium</span></li>
              <li><i class="elevation-swatch elevation-high" aria-hidden="true"></i><span data-elevation-ratio="0.82">High</span></li>
              <li><i class="elevation-swatch elevation-highest" aria-hidden="true"></i><span data-elevation-ratio="1">Highest</span></li>
            </ol>
          </div>
          <p id="elevation-legend-status" class="elevation-legend-status" role="status"></p>
          <div class="terrain-path-controls">
            <div class="terrain-avoidance-controls">
              <button id="terrain-avoidance-draw-button" class="terrain-control-button" type="button" aria-pressed="false">Draw barriers to avoid</button>
              <button id="terrain-avoidance-clear-button" class="terrain-control-button terrain-control-button-secondary" type="button" disabled>Clear avoidance barriers</button>
              <p id="terrain-avoidance-status" class="terrain-path-status" role="status" aria-live="polite">No avoidance barriers</p>
            </div>
            <div class="terrain-slope-control">
              <label for="terrain-maximum-slope-input">Maximum allowed slope</label>
              <div class="terrain-slope-input-row">
                <input id="terrain-maximum-slope-input" type="number" min="0" max="90" step="0.1" inputmode="decimal" aria-describedby="terrain-maximum-slope-help">
                <span>degrees</span>
              </div>
              <p id="terrain-maximum-slope-help">Leave blank for no slope limit.</p>
            </div>
            <button id="terrain-path-button" class="terrain-path-button" type="button" aria-pressed="false" disabled>Find shortest terrain path</button>
            <p id="terrain-path-status" class="terrain-path-status" role="status" aria-live="polite"></p>
          </div>
        </section>
        <div id="popup" class="map-popup" role="dialog" aria-label="Location details" aria-live="polite">
          <button id="popup-close" class="popup-close" type="button" aria-label="Close location details">×</button>
          <div id="popup-content"></div>
        </div>
      </section>

      <aside id="location-results-sidebar" class="sidebar results-sidebar" aria-label="Search results">
        <div class="sidebar-heading">
          <h2>Search results</h2>
        </div>
        <div class="results-summary" aria-live="polite">
          <span id="result-count">0 locations</span>
        </div>
        <p id="loading-message" class="status-message loading-message" role="status">Loading campus locations…</p>
        <p id="error-message" class="status-message error-message" role="alert" hidden></p>
        <section class="location-results" aria-label="Visible campus locations">
          <div id="location-list" class="location-list"></div>
        </section>
      </aside>
    </main>
  </div>

  <script type="importmap">
    {
      "imports": {
        "rbush": "https://esm.sh/rbush@4.0.1?bundle",
        "geotiff": "https://esm.sh/geotiff@2.1.3?bundle"
      }
    }
  </script>
  <script type="module" src="/js/map.js?v=17"></script>
</body>
</html>
